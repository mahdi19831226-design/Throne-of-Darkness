function theme(i){const ty=i%8,v=i>>3,h=(HB[ty]+v*17)%360,h2=(h+35)%360,sd=((v*5+ty*3)%4)*6,f=(s,l,a)=>'hsla('+h+','+Math.min(90,s+sd)+'%,'+l+'%,'+(a==null?1:a)+')';
 return{ty,h,v,name:BNm[ty]+' '+CNm[v],d:i/(NW-1),s1:f(48,14),s2:f(52,8),s3:f(55,3),far:f(40,10),mid:f(38,15),p1:f(30,17),p2:f(35,7),ed:f(38,44),ac:'hsl('+h2+',78%,68%)',acA:a=>'hsla('+h2+',78%,68%,'+a+')',fg:f(60,70,.05)}}
let gs=1;const gr=()=>(gs=gs*16807%2147483647)/2147483647;

 }
 P.push([x,400,LW-x,100]);P.push([LW,0,40,600]);BN.push(x+90|0);
 const mk=(nx,m,h)=>{const q=NP.length,kd=(i*3+q*5)%8;NP.push({x:nx,m,h:(h+q*37)%360,k:kd,sk:(i+q*2)%5,nm:NN[kd],t:0,seen:0})};
 if(i==0){[150,300,450].forEach((nx,k)=>mk(nx,TUT[k],150+k*50));[1,2,3].forEach((k,j)=>{const sg=sgs[Math.min(k,sgs.length-1)];mk(sg[0]+sg[1]/2|0,TUT[3+j],200+j*60)})}
 else mk(130,HF[i]||HT[i%8],(i*47)%360);
 mk(x+30,BH[pat],(i*29+90)%360);
 const nf=(3+(d*5|0)+(gr()*3|0))*horde;
 for(let k=0;k<nf;k++){const fx=500+gr()*(ex-300),fy=170+gr()*160;E({t:'f',x:fx,y:fy,bx:fx,by:fy,hx:fx,w:20,h:20,hp:H1(1+(d>.45?1:0)),al:1,fl:0,tt:gr()*6,amp:60+gr()*70,dz:PI==2?1:0})}

 {const s=1+i/90+(major?.12:0),hp=8+(i*.9|0)+(major?6:0);en.push({t:'b',x:LW-300,y:250,w:56*s|0,h:64*s|0,vx:0,vy:0,hp,mh:hp,mhp:hp,al:1,fl:0,jt:2.5,on:0,g:0,pat,nm:(major?'سيّد ':'حارس ')+TH.name})}
 pt={x:LW-110,y:296,w:56,h:104};
}

function mv(o,dt){
 o.x+=o.vx*dt;for(const r of P)if(hit(o,r)){if(o.vx>0)o.x=r[0]-o.w;else if(o.vx<0)o.x=r[0]+r[2];o.vx=0}

function upd(dt){
